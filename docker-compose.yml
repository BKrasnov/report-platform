services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - sh
      - -lc
      - pnpm --filter @report-platform/api db:init
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - sh
      - -lc
      - pnpm --filter @report-platform/api start:prod
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      REPORT_STORAGE_PATH: /app/storage/reports
      WORKER_POLL_INTERVAL_MS: 2000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - report_artifacts:/app/storage/reports

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - sh
      - -lc
      - pnpm --filter @report-platform/api start:worker:prod
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      REPORT_STORAGE_PATH: /app/storage/reports
      WORKER_POLL_INTERVAL_MS: 2000
      WORKER_RUN_TIMEOUT_MS: 900000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - report_artifacts:/app/storage/reports

volumes:
  postgres_data:
  report_artifacts:
